[package]
name = "epsicut-render"
description = "Sequence evaluation and CPU reference compositor (linear-light premultiplied f32)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
epsicut-time = { workspace = true }
epsicut-geom = { workspace = true }
epsicut-color = { workspace = true }
epsicut-frame = { workspace = true }
epsicut-media = { workspace = true }
epsicut-project = { workspace = true }
epsicut-audio-dsp = { workspace = true }
epsicut-captions = { workspace = true }
epsicut-text = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread CPU clock for load-robust performance tests.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
