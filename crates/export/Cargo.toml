[package]
name = "epsicut-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
epsicut-time = { workspace = true }
epsicut-frame = { workspace = true }
epsicut-color = { workspace = true }
epsicut-media = { workspace = true }
epsicut-codecs = { workspace = true }
epsicut-project = { workspace = true }
epsicut-render = { workspace = true }
epsicut-audio-dsp = { workspace = true }
epsicut-geom = { workspace = true }
epsicut-text = { workspace = true }
epsicut-isobmff = { workspace = true }
epsicut-prores = { workspace = true }
epsicut-dnx = { workspace = true }
epsicut-apv = { workspace = true }
epsicut-mxf = { workspace = true }
epsicut-aac = { workspace = true }
epsicut-flac = { workspace = true }
epsicut-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
epsicut-testkit = { workspace = true }
