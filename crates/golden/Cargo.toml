[package]
name = "epsicut-golden"
description = "Golden-image tests for the CPU renderer/compositor and GPU-vs-CPU parity (test-only crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Test-only: the library is empty and everything is a dev-dependency, so the crate adds no edges
# to the layer graph. Goldens live in `goldens/` (see docs/testing.md §3).
[dependencies]

[dev-dependencies]
epsicut-testkit = { workspace = true }
epsicut-color = { workspace = true }
epsicut-frame = { workspace = true }
epsicut-time = { workspace = true }
epsicut-geom = { workspace = true }
epsicut-media = { workspace = true }
epsicut-project = { workspace = true }
epsicut-render = { workspace = true }
epsicut-gpu = { workspace = true }
pollster = "1"
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
