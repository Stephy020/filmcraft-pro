[package]
name = "epsicut-engine"
description = "EpsiCut engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["epsicut-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["epsicut-speech/download"]
# Natural voices for Text to Speech: Kokoro-82M on candle (CPU) and their download.
neural-voices = ["epsicut-tts/kokoro", "speech-download"]

[dependencies]
epsicut-time = { workspace = true }
epsicut-geom = { workspace = true }
epsicut-color = { workspace = true }
epsicut-frame = { workspace = true }
epsicut-media = { workspace = true }
epsicut-codecs = { workspace = true }
epsicut-project = { workspace = true }
epsicut-edit = { workspace = true }
epsicut-render = { workspace = true }
epsicut-scopes = { workspace = true }
epsicut-text = { workspace = true }
epsicut-audio-dsp = { workspace = true }
epsicut-export = { workspace = true }
epsicut-mxf = { workspace = true }
epsicut-format = { workspace = true }
epsicut-interchange = { workspace = true }
epsicut-captions = { workspace = true }
epsicut-speech = { workspace = true }
epsicut-tts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
craft-docpath = { workspace = true }
web-time = "1"

[dev-dependencies]
epsicut-testkit = { workspace = true }
epsicut-dng = { workspace = true, features = ["writer"] }
epsicut-isobmff = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
