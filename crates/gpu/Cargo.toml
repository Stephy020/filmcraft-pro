[package]
name = "epsicut-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
epsicut-color = { workspace = true }
epsicut-frame = { workspace = true }
epsicut-geom = { workspace = true }
epsicut-project = { workspace = true }
epsicut-render = { workspace = true }
epsicut-time = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
pollster = "1"
rayon = { workspace = true }

[dev-dependencies]
pollster = "1"
epsicut-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
epsicut-media = { workspace = true }
epsicut-time = { workspace = true }
