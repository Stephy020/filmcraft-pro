[package]
name = "epsicut-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
epsicut-time = { workspace = true }
epsicut-color = { workspace = true }
epsicut-frame = { workspace = true }
epsicut-media = { workspace = true }
epsicut-avi = { workspace = true }
epsicut-isobmff = { workspace = true }
epsicut-matroska = { workspace = true }
epsicut-mxf = { workspace = true }
epsicut-mpegts = { workspace = true }
epsicut-mpeg2v = { workspace = true }
epsicut-ac3 = { workspace = true }
epsicut-mpa = { workspace = true }
epsicut-ogg = { workspace = true }
epsicut-bitstream = { workspace = true }
epsicut-h264 = { workspace = true }
epsicut-hevc = { workspace = true }
epsicut-vp8 = { workspace = true }
epsicut-vp9 = { workspace = true }
epsicut-prores = { workspace = true }
epsicut-dnx = { workspace = true }
epsicut-av1 = { workspace = true }
epsicut-apv = { workspace = true }
epsicut-aac = { workspace = true }
epsicut-opus = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
epsicut-testkit = { workspace = true }
serde_json = { workspace = true }
