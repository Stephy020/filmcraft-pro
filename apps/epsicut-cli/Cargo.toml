[package]
name = "epsicut-cli"
description = "EpsiCut headless CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "epsicut-cli"
path = "src/main.rs"

[features]
default = []
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["epsicut-engine/whisper", "epsicut-engine/speech-download"]

[dependencies]
epsicut-engine = { workspace = true }
epsicut-export = { workspace = true }
epsicut-project = { workspace = true }
epsicut-render = { workspace = true }
epsicut-time = { workspace = true }
epsicut-gpu = { workspace = true }
epsicut-media = { workspace = true }
epsicut-codecs = { workspace = true }
epsicut-platform = { workspace = true }
epsicut-mxf = { workspace = true }
epsicut-mpegts = { workspace = true }
epsicut-ogg = { workspace = true }
epsicut-automation = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
epsicut-testkit = { workspace = true }
