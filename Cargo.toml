[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.17.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Stephy020/epsicut"

[workspace.dependencies]
# internal
epsicut-time = { path = "crates/time" }
epsicut-geom = { path = "crates/geom" }
epsicut-color = { path = "crates/color" }
epsicut-bitstream = { path = "crates/bitstream" }
epsicut-isobmff = { path = "crates/isobmff" }
epsicut-avi = { path = "crates/avi" }
epsicut-matroska = { path = "crates/matroska" }
epsicut-mxf = { path = "crates/mxf" }
epsicut-cfb = { path = "crates/cfb" }
epsicut-mpegts = { path = "crates/mpegts" }
epsicut-mpeg2v = { path = "crates/mpeg2v" }
epsicut-ac3 = { path = "crates/ac3" }
epsicut-mpa = { path = "crates/mpa" }
epsicut-ogg = { path = "crates/ogg" }
epsicut-h264 = { path = "crates/h264" }
epsicut-hevc = { path = "crates/hevc" }
epsicut-vp8 = { path = "crates/vp8" }
epsicut-vp9 = { path = "crates/vp9" }
epsicut-prores = { path = "crates/prores" }
epsicut-dnx = { path = "crates/dnx" }
epsicut-apv = { path = "crates/apv" }
epsicut-dng = { path = "crates/dng" }
epsicut-av1 = { path = "crates/av1" }
epsicut-aac = { path = "crates/aac" }
epsicut-flac = { path = "crates/flac" }
epsicut-opus = { path = "crates/opus" }
epsicut-h264enc = { path = "crates/h264enc" }
epsicut-audio-dsp = { path = "crates/audio-dsp" }
epsicut-frame = { path = "crates/frame" }
epsicut-media = { path = "crates/media" }
epsicut-codecs = { path = "crates/codecs" }
epsicut-project = { path = "crates/project" }
epsicut-edit = { path = "crates/edit" }
epsicut-interchange = { path = "crates/interchange" }
epsicut-text = { path = "crates/text" }
epsicut-captions = { path = "crates/captions" }
epsicut-speech = { path = "crates/speech" }
epsicut-tts = { path = "crates/tts" }
epsicut-tts-text = { path = "crates/tts-text" }
epsicut-render = { path = "crates/render" }
epsicut-gpu = { path = "crates/gpu" }
epsicut-scopes = { path = "crates/scopes" }
epsicut-export = { path = "crates/export" }
epsicut-format = { path = "crates/format" }
epsicut-engine = { path = "crates/engine" }
epsicut-ui-egui = { path = "crates/ui-egui" }
epsicut-automation = { path = "crates/automation" }
epsicut-platform = { path = "crates/platform" }
epsicut-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
url = "2.5.8"
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
proptest = "1"
roxmltree = "0.21"
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }
craft-media = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", default-features = false }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", features = ["serde", "native-windows"] }
# egui 0.37: bundled fonts are opt-in, and the monochrome symbol/emoji faces moved to their own
# feature. EpsiCut paints ✔ ✓ ✖ ⚡ ⚠ ⚙ ♪ ☑ in panel chrome, so both features are part of the
# production font policy (system_fonts stays off).
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
# craft-update: app-specific pretend versions apply to startup and manual checks.
craft-update = { git = "https://github.com/storytold/craft-libs", version = "=0.1.0", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", features = ["egui"] }
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

# Line tables keep file and line in panics and backtraces at a fraction of full debug info's size;
# dependencies need none.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.epsicut-h264]
opt-level = 3

[profile.dev.package.epsicut-h264enc]
opt-level = 3

[profile.dev.package.epsicut-hevc]
opt-level = 3

[profile.dev.package.epsicut-prores]
opt-level = 3

[profile.dev.package.epsicut-dnx]
opt-level = 3

[profile.dev.package.epsicut-apv]
opt-level = 3

[profile.dev.package.epsicut-dng]
opt-level = 3

[profile.dev.package.epsicut-av1]
opt-level = 3

[profile.dev.package.epsicut-aac]
opt-level = 3

[profile.dev.package.epsicut-flac]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.epsicut-audio-dsp]
opt-level = 3

[profile.dev.package.epsicut-mxf]
opt-level = 3

[profile.dev.package.epsicut-opus]
opt-level = 3

[profile.dev.package.epsicut-vp8]
opt-level = 3

[profile.dev.package.epsicut-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Keep the complete egui family and native event bridge on reviewed fork commits.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
